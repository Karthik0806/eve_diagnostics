services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_diagnostics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_diagnostics"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/eve_diagnostics
      DB_USERNAME: eve
      DB_PASSWORD: eve
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-dev-webhook-secret}

volumes:
  pgdata:
