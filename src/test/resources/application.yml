spring:
  datasource:
    url: jdbc:h2:mem:evetest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop     # tests build the schema from the entities; production uses Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: test-jwt-secret-test-jwt-secret-0123456789
    expiration-minutes: 60
  webhook:
    secret: test-webhook-secret
    signature-required: true
  payment-sim:
    success-rate: 1.0
  admin:
    email: admin@eve.test
    password: Admin@12345
  seed:
    sample-data: false
  rate-limit:
    enabled: false
